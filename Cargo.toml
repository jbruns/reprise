[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
title-select-api = { path = "crates/api" }
title-select-engine = { path = "crates/engine" }
title-select-store = { path = "crates/store" }
title-select-server = { path = "crates/server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
jiff = { version = "0.2.38", features = ["serde"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
