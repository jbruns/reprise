[package]
name = "title-select"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Audits ROM collections against DAT revisions"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
jiff = { version = "0.2.38", features = ["serde"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
