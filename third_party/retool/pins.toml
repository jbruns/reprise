# Pins for the Selection engine (ADR 0001). tools/retool/build.py verifies all of them before it
# builds Retool, and every Selection reports the Retool commit, the patch-set digest and the clone-list
# commit.

# The vendored Retool tree. It changes only by hand: vendor the new tree, then run
# `python3 tools/retool/build.py hash-tree` and copy its hashes here.
[retool]
repository = "https://github.com/unexpectedpanda/retool"
commit = "59f169f530580448c055c781cb3166910c7bdba5"
# Every file under upstream/.
tree_sha256 = "2082d4847a05a549e6fc08a67cfb17b08b1601fb73798412827fba5e774b1fb3"
# Only LICENSE, retool.py and modules/: the files the image ships.
runtime_sha256 = "156cb9cdb631f51bc5a88aaf6cfae373b0f677a3253569ec7d2e979d15f30ff1"

# Applied in this order. The patch-set digest is the sha256 of these hashes, concatenated in order.
[[patches]]
file = "0001-no-network.patch"
sha256 = "95551434dbe1acda15988829e867148eec0c14c42919bfe57b83e1fb72f504f1"

[[patches]]
file = "0002-run-paths.patch"
sha256 = "0435fab19bf1ce91bd5dc3d6b5e4d02718950689ca8e1cba12abf3f10a065e82"

[[patches]]
file = "0003-trace-json.patch"
sha256 = "7dc28d02f983c957a42ae0b17f62b90229099fed2f4d9597d90c0ec22fbb5dab"

[[patches]]
file = "0004-system-settings.patch"
sha256 = "aeba088d2c5e8c7ccde64f17533ef9e72e5fe9993d4a0d21fe13490754f69a27"

# Clone lists, metadata, MIAs and RetroAchievements, fetched as the archive of this commit. Renovate
# proposes upstream's newest main commit; the clone-list-pin workflow then writes the new archive's
# sha256 (`python3 tools/retool/build.py pin-clone-lists`).
[clone_lists]
repository = "https://github.com/unexpectedpanda/retool-clonelists-metadata"
branch = "main"
commit = "cdeb391e2ea422475dc82091278c9c9ae3f340ae"
archive_sha256 = "cb3c9cdc9fb013ce60e779ff6da511ebfb3692c5b4ce7328eacd018c6a6ddf8a"
