name: clone-list pin

# Renovate moves the clone-list commit in third_party/retool/pins.toml but can't know the new archive's
# sha256. This writes it on the Renovate branch, then runs CI on the result: a push made with the workflow's
# token starts no workflows by itself.

on:
  push:
    branches: ['renovate/**']
    paths: [third_party/retool/pins.toml]

permissions:
  contents: read

concurrency:
  group: clone-list-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: clone-list archive sha256
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/retool/build.py pin-clone-lists
      - name: commit and run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "the archive sha256 is already pinned"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Pin the clone-list archive sha256'
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yaml --ref "$BRANCH"
